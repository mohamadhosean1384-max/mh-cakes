<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.H Cakes | شیرینی خانگی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf1e1;
    --ink: #3a2416;
    --ink-soft: #6b5439;
    --accent: #b8722e;
    --accent-ink: #fff8ee;
    --accent-2: #7c8a52;
    --card: #f3e4c8;
    --line: #d9c4a0;
    --shadow: rgba(58, 36, 22, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211509;
      --ink: #f3e4c8;
      --ink-soft: #c9ac82;
      --accent: #e0995a;
      --accent-ink: #241708;
      --accent-2: #a3b278;
      --card: #2c1c10;
      --line: #4a3625;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #211509;
    --ink: #f3e4c8;
    --ink-soft: #c9ac82;
    --accent: #e0995a;
    --accent-ink: #241708;
    --accent-2: #a3b278;
    --card: #2c1c10;
    --line: #4a3625;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background-image:
      radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -6px -6px;
  }

  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding: 40px 24px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
    box-shadow: 0 8px 20px -6px var(--shadow);
  }

  h1 {
    font-size: 27px;
    font-weight: 800;
    margin: 4px 0 2px;
    letter-spacing: 0.2px;
  }

  .tagline {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 30px;
    line-height: 1.9;
    max-width: 300px;
  }

  .divider {
    width: 100%;
    max-width: 260px;
    height: 1px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 16px);
    margin: 6px 0 28px;
  }

  /* Instagram — the hero action, styled like a wax stamp */
  .stamp {
    position: relative;
    width: 100%;
    max-width: 300px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 17px;
    padding: 18px 22px;
    border-radius: 999px;
    box-shadow: 0 10px 24px -8px var(--shadow);
    transition: transform 0.15s ease;
  }
  .stamp:active { transform: scale(0.97); }
  .stamp svg { width: 22px; height: 22px; flex-shrink: 0; }

  .stamp-note {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 10px 0 30px;
  }

  /* messenger rows */
  .rows {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 13px 16px;
    text-align: right;
  }

  .row-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .row-icon svg { width: 20px; height: 20px; }

  .row-body { flex: 1; min-width: 0; }
  .row-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 1px; }
  .row-value { font-size: 15px; font-weight: 600; direction: ltr; text-align: right; unicode-bidi: bidi-override; }

  .copy-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--accent-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .copy-btn:active { background: var(--line); }

  footer {
    margin-top: 34px;
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>

  <script>
    function copyVal(id, btn) {
      var text = document.getElementById(id).textContent.trim();
      var done = function () {
        var old = btn.textContent;
        btn.textContent = 'کپی شد ✓';
        setTimeout(function () { btn.textContent = old; }, 1500);
      };
      try {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
      } catch (e) {
        fallbackCopy(text, done);
      }
    }
    function fallbackCopy(text, done) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) {}
    }
  </script>
